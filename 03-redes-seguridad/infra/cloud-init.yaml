#cloud-config
write_files:
  - path: /opt/leadutp/server.py
    permissions: '0644'
    content: |
      import json
      import socket
      from http.server import BaseHTTPRequestHandler, HTTPServer
      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              body = json.dumps({'service': 'leadutp-network-lab', 'host': socket.gethostname(), 'status': 'ok'}).encode()
              self.send_response(200)
              self.send_header('Content-Type', 'application/json')
              self.send_header('Content-Length', str(len(body)))
              self.end_headers()
              self.wfile.write(body)
      HTTPServer(('0.0.0.0', 80), Handler).serve_forever()
  - path: /etc/systemd/system/leadutp-web.service
    permissions: '0644'
    content: |
      [Unit]
      Description=LEAD UTP network lab HTTP endpoint
      After=network.target
      [Service]
      ExecStart=/usr/bin/python3 /opt/leadutp/server.py
      Restart=on-failure
      User=nobody
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now leadutp-web
