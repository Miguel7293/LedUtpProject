<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andes · Catálogo</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#18322c;background:#f4f1e9}*{box-sizing:border-box}body{margin:0}header{padding:24px 7vw;border-bottom:1px solid #d7dfd5;display:flex;justify-content:space-between;gap:20px}a{color:inherit}main{max-width:1100px;margin:auto;padding:70px 28px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#537065}h1{font-size:clamp(38px,7vw,72px);letter-spacing:-3px;margin:20px 0}p{line-height:1.7;color:#537065}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:40px}article{background:#fffdf8;border:1px solid #d7dfd5;border-radius:14px;padding:28px}article span{color:#537065;font-size:13px}article h2{font-size:23px;margin:18px 0}article strong{font-size:28px}.notice{border-left:3px solid #aa5b30;padding-left:14px}button{background:#18322c;color:white;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}footer{margin-top:48px;font-size:12px;color:#537065}
  </style>
</head>
<body>
  <header><strong>ANDES / LEAD UTP</strong><span>Catálogo de demostración</span></header>
  <main>
    <div class="eyebrow">Colección esencial · Perú</div>
    <h1>Para tu día a día.</h1>
    <p>Una selección pequeña de productos para acompañarte donde estudies, trabajes o explores.</p>
    <p id="status" role="status">Cargando productos…</p>
    <div id="products" class="grid"></div>
    <button id="retry" hidden>Volver a intentar</button>
    <footer>Precios en soles · Datos ficticios · Sin compras ni pagos</footer>
  </main>
  <script>
    const statusNode=document.getElementById('status'),grid=document.getElementById('products'),retry=document.getElementById('retry');
    async function load(){
      retry.hidden=true;grid.replaceChildren();statusNode.textContent='Cargando productos…';
      try{
        const response=await fetch('/api/products');if(!response.ok)throw new Error('unavailable');
        const data=await response.json();
        for(const item of data.items){
          const card=document.createElement('article'),category=document.createElement('span'),name=document.createElement('h2'),price=document.createElement('strong');
          category.textContent=item.category;name.textContent=item.name;price.textContent=new Intl.NumberFormat('es-PE',{style:'currency',currency:data.currency}).format(item.price);
          card.append(category,name,price);grid.append(card);
        }
        statusNode.textContent=data.items.length?'Explora la colección.':'Todavía no hay productos disponibles.';
      }catch{statusNode.textContent='El catálogo no está disponible en este momento.';retry.hidden=false;}
    }
    retry.addEventListener('click',load);load();
  </script>
</body>
</html>
